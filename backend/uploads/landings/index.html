<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized App Discovery - Validate Your Idea</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .hero {
            text-align: center;
            color: white;
            padding: 100px 20px;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 40px;
        }
        .cta-button {
            background: #ff6b6b;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .cta-button:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>You Have an Idea. But Is There Demand?</h1>
        <p>Find out in 3 days without wasting your marketing budget. Real data from forums, search trends, and structured interviews.</p>
        <button class="cta-button" onclick="showForm()">Validate Your Idea</button>
    </div>

    <script>
        function showForm() {
            alert('Form would open here - Name, Email, Project Description');
        }
    </script>
</body>
</html>
