<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f8f8; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Session Debug Tool</h1>

    <div id="status" class="status">Initializing...</div>

    <div class="controls">
        <button onclick="checkSession()">Check Session</button>
        <button onclick="login()">Login Test</button>
        <button onclick="checkWorkspaces()">Check Workspaces</button>
        <button onclick="clearStorage()">Clear Storage</button>
    </div>

    <div class="results">
        <h2>Results:</h2>
        <pre id="results">Waiting...</pre>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        const FRONTEND_BASE = 'http://localhost:5175';

        function log(message) {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            results.textContent += `[${timestamp}] ${message}\n`;
            console.log(message);
        }

        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${isError ? 'error' : 'success'}`;
        }

        async function checkSession() {
            try {
                log('Checking session...');
                const response = await fetch(`${API_BASE}/auth/session`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    log(`Session OK: ${JSON.stringify(data)}`);
                    updateStatus(`✅ Authenticated as ${data.user?.email || 'unknown'}`);
                } else {
                    const error = await response.text();
                    log(`Session failed (${response.status}): ${error}`);
                    updateStatus(`❌ Not authenticated (${response.status})`, true);
                }
            } catch (error) {
                log(`Session check error: ${error.message}`);
                updateStatus(`❌ Error: ${error.message}`, true);
            }
        }

        async function login() {
            try {
                log('Attempting login...');
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    log(`Login successful: ${JSON.stringify(data)}`);
                    updateStatus('✅ Login successful');

                    // Check cookies
                    log('Checking cookies...');
                    document.cookie.split(';').forEach(cookie => {
                        if (cookie.includes('validatey')) {
                            log(`Cookie: ${cookie.trim()}`);
                        }
                    });

                } else {
                    const error = await response.text();
                    log(`Login failed (${response.status}): ${error}`);
                    updateStatus(`❌ Login failed: ${error}`, true);
                }
            } catch (error) {
                log(`Login error: ${error.message}`);
                updateStatus(`❌ Login error: ${error.message}`, true);
            }
        }

        async function checkWorkspaces() {
            try {
                log('Checking workspaces...');
                const response = await fetch(`${API_BASE}/workspaces`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    log(`Workspaces OK: ${JSON.stringify(data)}`);
                    updateStatus(`✅ Workspaces loaded (${data.workspaces?.length || 0} items)`);
                } else {
                    const error = await response.text();
                    log(`Workspaces failed (${response.status}): ${error}`);
                    updateStatus(`❌ Workspaces failed (${response.status})`, true);
                }
            } catch (error) {
                log(`Workspaces error: ${error.message}`);
                updateStatus(`❌ Workspaces error: ${error.message}`, true);
            }
        }

        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            log('Storage cleared');
            updateStatus('🗑️ Storage cleared');
        }

        // Auto-check on load
        window.addEventListener('load', () => {
            log('Page loaded, checking session...');
            checkSession();
        });
    </script>
</body>
</html>
